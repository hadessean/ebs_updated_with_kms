name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to confirm infrastructure deletion"
        required: true
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-destroy
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

  # Infrastructure region
  AWS_REGION: us-east-1

  # Your Terraform state bucket region
  TF_STATE_REGION: ap-southeast-2


jobs:

  # =========================================================
  # 1. TERRAFORM DESTROY PLAN
  # =========================================================
  destroy-plan:
    name: Terraform Destroy Plan

    if: github.event.inputs.confirm_destroy == 'DESTROY'

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-terraform-destroy-plan

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=ec2/terraform.tfstate" \
            -backend-config="region=${{ env.TF_STATE_REGION }}" \
            -backend-config="use_lockfile=true"

      # Important safety check
      - name: Show Terraform State
        run: |
          echo "====================================="
          echo "Resources currently managed:"
          echo "====================================="
          terraform state list

      - name: Terraform Destroy Plan
        run: terraform plan -destroy -input=false -out=destroy.tfplan

      - name: Upload Destroy Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan-${{ github.run_id }}
          path: destroy.tfplan
          retention-days: 1


  # =========================================================
  # 2. MANUAL APPROVAL
  # =========================================================
  destroy-approval:
    name: Approve Infrastructure Destruction

    needs: destroy-plan

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Destruction Approved
        run: |
          echo "====================================="
          echo " INFRASTRUCTURE DESTRUCTION APPROVED"
          echo "====================================="
          echo "Terraform Destroy is now authorized."


  # =========================================================
  # 3. TERRAFORM DESTROY
  # =========================================================
  destroy:
    name: Terraform Destroy

    needs:
      - destroy-plan
      - destroy-approval

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-terraform-destroy

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform Init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=ec2/terraform.tfstate" \
            -backend-config="region=${{ env.TF_STATE_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Download Approved Destroy Plan
        uses: actions/download-artifact@v5
        with:
          name: terraform-destroy-plan-${{ github.run_id }}

      - name: Show Destroy Plan
        run: terraform show destroy.tfplan

      - name: Terraform Destroy
        run: terraform apply -input=false -auto-approve destroy.tfplan

      - name: Verify Terraform State
        run: |
          echo "====================================="
          echo "Remaining Terraform resources:"
          echo "====================================="
          terraform state list
