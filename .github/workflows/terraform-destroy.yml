name: Terraform Destroy

on:
  workflow_dispatch:
    inputs:
      confirm_destroy:
        description: "Type DESTROY to confirm"
        required: true
        type: string

      state_key:
        description: "Terraform state key in S3"
        required: true
        default: "ec2/terraform.tfstate"
        type: string


# ============================================================
# REQUIRED FOR GITHUB OIDC -> AWS
# ============================================================
permissions:
  contents: read
  id-token: write


# ============================================================
# PREVENT MULTIPLE DESTROY RUNS
# ============================================================
concurrency:
  group: terraform-destroy
  cancel-in-progress: false


# ============================================================
# GLOBAL VARIABLES
# ============================================================
env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false

  # AWS resources are running here
  AWS_REGION: us-east-1

  # Terraform state bucket is here
  TF_STATE_REGION: ap-southeast-2


jobs:

  # ==========================================================
  # 1. FIND + VALIDATE STATE + CREATE DESTROY PLAN
  # ==========================================================
  destroy-plan:

    name: Terraform Destroy Plan

    if: github.event.inputs.confirm_destroy == 'DESTROY'

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # SETUP TERRAFORM
      # ======================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"


      # ======================================================
      # AWS AUTHENTICATION
      # ======================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-terraform-destroy-plan


      # ======================================================
      # VERIFY AWS ACCOUNT
      # ======================================================
      - name: Verify AWS Identity
        run: |
          echo "=========================================="
          echo "AWS IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity


      # ======================================================
      # CHECK VARIABLES
      # ======================================================
      - name: Validate Backend Variables
        run: |

          echo "=========================================="
          echo "BACKEND CONFIGURATION"
          echo "=========================================="

          echo "AWS Region:"
          echo "${{ env.AWS_REGION }}"

          echo ""
          echo "Terraform State Region:"
          echo "${{ env.TF_STATE_REGION }}"

          echo ""
          echo "Terraform State Bucket:"
          echo "${{ vars.TF_STATE_BUCKET }}"

          echo ""
          echo "Requested State Key:"
          echo "${{ inputs.state_key }}"

          echo ""

          if [ -z "${{ vars.TF_STATE_BUCKET }}" ]; then

            echo "ERROR: TF_STATE_BUCKET is empty."

            echo ""
            echo "Configure:"
            echo "GitHub -> Settings"
            echo "Secrets and variables"
            echo "Actions"
            echo "Variables"
            echo "TF_STATE_BUCKET"

            exit 1

          fi


      # ======================================================
      # LIST EVERYTHING IN STATE BUCKET
      #
      # IMPORTANT:
      # This lets us see where terraform.tfstate actually is.
      # ======================================================
      - name: List S3 State Bucket
        run: |

          echo "=========================================="
          echo "S3 STATE BUCKET CONTENTS"
          echo "=========================================="

          aws s3 ls \
            "s3://${{ vars.TF_STATE_BUCKET }}" \
            --recursive \
            --region "${{ env.TF_STATE_REGION }}"


      # ======================================================
      # FIND TFSTATE FILES
      # ======================================================
      - name: Find Terraform State Files
        run: |

          echo "=========================================="
          echo "SEARCHING FOR TERRAFORM STATE FILES"
          echo "=========================================="

          aws s3api list-objects-v2 \
            --bucket "${{ vars.TF_STATE_BUCKET }}" \
            --region "${{ env.TF_STATE_REGION }}" \
            --query "Contents[?contains(Key, 'tfstate')].[Key,Size,LastModified]" \
            --output table


      # ======================================================
      # VERIFY REQUESTED STATE EXISTS
      #
      # Workflow STOPS here if state does not exist.
      # ======================================================
      - name: Verify Selected Terraform State
        run: |

          echo "=========================================="
          echo "VERIFYING TERRAFORM STATE"
          echo "=========================================="

          echo "Bucket:"
          echo "${{ vars.TF_STATE_BUCKET }}"

          echo ""

          echo "Key:"
          echo "${{ inputs.state_key }}"

          echo ""

          if aws s3api head-object \
            --bucket "${{ vars.TF_STATE_BUCKET }}" \
            --key "${{ inputs.state_key }}" \
            --region "${{ env.TF_STATE_REGION }}" \
            > /dev/null 2>&1
          then

            echo "=========================================="
            echo "STATE FILE FOUND"
            echo "=========================================="

          else

            echo "=========================================="
            echo "ERROR: STATE FILE NOT FOUND"
            echo "=========================================="

            echo ""
            echo "Requested:"
            echo "s3://${{ vars.TF_STATE_BUCKET }}/${{ inputs.state_key }}"

            echo ""
            echo "Look at the previous step:"
            echo "Find Terraform State Files"

            echo ""
            echo "Then run this workflow again and enter"
            echo "the correct state key."

            echo ""
            echo "DESTROY HAS BEEN BLOCKED."

            exit 1

          fi


      # ======================================================
      # TERRAFORM INIT
      # ======================================================
      - name: Terraform Init
        run: |

          echo "=========================================="
          echo "TERRAFORM INIT"
          echo "=========================================="

          terraform init \
            -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ inputs.state_key }}" \
            -backend-config="region=${{ env.TF_STATE_REGION }}" \
            -backend-config="use_lockfile=true"


      # ======================================================
      # SHOW STATE
      # ======================================================
      - name: Show Terraform State
        run: |

          echo "=========================================="
          echo "TERRAFORM MANAGED RESOURCES"
          echo "=========================================="

          terraform state list


      # ======================================================
      # COUNT STATE RESOURCES
      #
      # Prevent destruction if state is unexpectedly empty.
      # ======================================================
      - name: Validate Terraform State
        run: |

          RESOURCE_COUNT=$(terraform state list | wc -l)

          echo "=========================================="
          echo "Terraform resources found: $RESOURCE_COUNT"
          echo "=========================================="

          if [ "$RESOURCE_COUNT" -eq 0 ]; then

            echo ""
            echo "ERROR:"
            echo "Terraform state contains zero resources."
            echo ""
            echo "Destroy has been stopped for safety."

            exit 1

          fi


      # ======================================================
      # CREATE DESTROY PLAN
      # ======================================================
      - name: Terraform Destroy Plan
        run: |

          echo "=========================================="
          echo "CREATING DESTROY PLAN"
          echo "=========================================="

          terraform plan \
            -destroy \
            -input=false \
            -out=destroy.tfplan


      # ======================================================
      # SHOW DESTROY PLAN
      # ======================================================
      - name: Show Terraform Destroy Plan
        run: |

          echo "=========================================="
          echo "DESTROY PLAN"
          echo "=========================================="

          terraform show \
            -no-color \
            destroy.tfplan


      # ======================================================
      # UPLOAD PLAN
      # ======================================================
      - name: Upload Destroy Plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-destroy-plan-${{ github.run_id }}
          path: destroy.tfplan
          retention-days: 1



  # ==========================================================
  # 2. MANUAL PRODUCTION APPROVAL
  # ==========================================================
  destroy-approval:

    name: Manual Destroy Approval

    needs:
      - destroy-plan

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:

      - name: Destruction Approved
        run: |

          echo "=========================================="
          echo "INFRASTRUCTURE DESTRUCTION APPROVED"
          echo "=========================================="

          echo ""
          echo "Terraform destroy is authorized."



  # ==========================================================
  # 3. DESTROY INFRASTRUCTURE
  # ==========================================================
  destroy:

    name: Terraform Destroy

    needs:
      - destroy-plan
      - destroy-approval

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # CHECKOUT
      # ======================================================
      - name: Checkout
        uses: actions/checkout@v4


      # ======================================================
      # SETUP TERRAFORM
      # ======================================================
      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"


      # ======================================================
      # AWS AUTHENTICATION
      # ======================================================
      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-terraform-destroy


      # ======================================================
      # VERIFY AWS ACCOUNT
      # ======================================================
      - name: Verify AWS Identity
        run: |

          echo "=========================================="
          echo "AWS IDENTITY"
          echo "=========================================="

          aws sts get-caller-identity


      # ======================================================
      # VERIFY STATE STILL EXISTS
      # ======================================================
      - name: Verify Terraform State
        run: |

          echo "=========================================="
          echo "VERIFYING STATE BEFORE DESTROY"
          echo "=========================================="

          aws s3api head-object \
            --bucket "${{ vars.TF_STATE_BUCKET }}" \
            --key "${{ inputs.state_key }}" \
            --region "${{ env.TF_STATE_REGION }}"

          echo ""
          echo "State file exists."


      # ======================================================
      # TERRAFORM INIT
      # ======================================================
      - name: Terraform Init
        run: |

          terraform init \
            -reconfigure \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=${{ inputs.state_key }}" \
            -backend-config="region=${{ env.TF_STATE_REGION }}" \
            -backend-config="use_lockfile=true"


      # ======================================================
      # SHOW STATE AGAIN
      # ======================================================
      - name: Show Terraform State Before Destroy
        run: |

          echo "=========================================="
          echo "RESOURCES BEFORE DESTROY"
          echo "=========================================="

          terraform state list


      # ======================================================
      # DOWNLOAD APPROVED PLAN
      # ======================================================
      - name: Download Destroy Plan
        uses: actions/download-artifact@v5
        with:
          name: terraform-destroy-plan-${{ github.run_id }}


      # ======================================================
      # SHOW APPROVED PLAN
      # ======================================================
      - name: Show Approved Destroy Plan
        run: |

          echo "=========================================="
          echo "APPROVED DESTROY PLAN"
          echo "=========================================="

          terraform show \
            -no-color \
            destroy.tfplan


      # ======================================================
      # DESTROY
      # ======================================================
      - name: Terraform Destroy
        run: |

          echo "=========================================="
          echo "DESTROYING AWS INFRASTRUCTURE"
          echo "=========================================="

          terraform apply \
            -input=false \
            -auto-approve \
            destroy.tfplan


      # ======================================================
      # VERIFY AFTER DESTROY
      # ======================================================
      - name: Verify Destroy
        run: |

          echo "=========================================="
          echo "CHECKING REMAINING RESOURCES"
          echo "=========================================="

          terraform state list || true

          echo ""
          echo "=========================================="
          echo "TERRAFORM DESTROY COMPLETED"
          echo "=========================================="
