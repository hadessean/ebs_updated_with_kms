name: Terraform CI/CD  

on:
  pull_request:
    branches: [main]

  push:
    branches: [main]

  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ github.ref }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  AWS_REGION: us-east-1

jobs:

  # =========================================================
  # 1. FORMAT AND VALIDATE
  # =========================================================
  fmt-validate:
    name: Format & Validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"

      - name: Terraform fmt
        run: terraform fmt -check -recursive

      - name: Terraform init without backend
        run: terraform init -backend=false

      - name: Terraform validate
        run: terraform validate


  # =========================================================
  # 2. TERRAFORM PLAN
  # =========================================================
  plan:
    name: Terraform Plan
    needs: fmt-validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"

      - name: Configure AWS credentials - Plan role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_PLAN_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-terraform-plan

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=ec2/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Terraform plan
        run: terraform plan -input=false -out=tfplan

      - name: Upload Terraform plan
        uses: actions/upload-artifact@v4
        with:
          name: terraform-plan-${{ github.sha }}
          path: tfplan
          retention-days: 5


  # =========================================================
  # 3. MANUAL APPROVAL
  # =========================================================
  approval:
    name: Manual Production Approval

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs: plan

    runs-on: ubuntu-latest

    environment:
      name: production

    steps:
      - name: Production deployment approved
        run: |
          echo "====================================="
          echo " Production deployment APPROVED"
          echo "====================================="
          echo "Commit: $GITHUB_SHA"
          echo "Terraform Apply is now authorized."


  # =========================================================
  # 4. TERRAFORM APPLY
  # =========================================================
  apply:
    name: Terraform Apply

    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    needs:
      - plan
      - approval

    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"

      - name: Configure AWS credentials - Apply role
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: github-terraform-apply

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Terraform init
        run: |
          terraform init \
            -backend-config="bucket=${{ vars.TF_STATE_BUCKET }}" \
            -backend-config="key=ec2/terraform.tfstate" \
            -backend-config="region=${{ env.AWS_REGION }}" \
            -backend-config="use_lockfile=true"

      - name: Download approved Terraform plan
        uses: actions/download-artifact@v5
        with:
          name: terraform-plan-${{ github.sha }}

      - name: Terraform Apply
        run: terraform apply -input=false -auto-approve tfplan
