
name: Terraform Multi-Environment

on:
  workflow_dispatch:
    inputs:
      environment:
        description: Select environment
        required: true
        type: choice
        options:
          - dev
          - test
          - prod

      action:
        description: Select action
        required: true
        type: choice
        options:
          - plan
          - apply
          - destroy

      confirm_destroy:
        description: Type DESTROY when destroying
        required: false
        type: string

permissions:
  contents: read
  id-token: write

concurrency:
  group: terraform-${{ inputs.environment }}
  cancel-in-progress: false

env:
  TF_IN_AUTOMATION: true
  TF_INPUT: false
  AWS_REGION: us-east-1
  TF_STATE_REGION: ap-southeast-2

jobs:
  terraform:
    name: ${{ inputs.action }} - ${{ inputs.environment }}
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.13.4"

      - name: Check destroy confirmation
        if: inputs.action == 'destroy'
        env:
          CONFIRM: ${{ inputs.confirm_destroy }}
        run: |
          if [ "$CONFIRM" != "DESTROY" ]; then
            echo "Destroy confirmation required"
            exit 1
          fi

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_APPLY_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS Identity
        run: aws sts get-caller-identity

      - name: Terraform Format
        run: terraform fmt -check -recursive

      - name: Terraform Init
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          terraform init -input=false \
            -backend-config="bucket=$STATE_BUCKET" \
            -backend-config="key=ec2/$DEPLOY_ENV/terraform.tfstate" \
            -backend-config="region=$TF_STATE_REGION" \
            -backend-config="use_lockfile=true"

      - name: Terraform Validate
        run: terraform validate

      - name: Check destroy state exists
        if: inputs.action == 'destroy'
        env:
          STATE_BUCKET: ${{ vars.TF_STATE_BUCKET }}
          DEPLOY_ENV: ${{ inputs.environment }}
        run: |
          aws s3api head-object \
            --bucket "$STATE_BUCKET" \
            --key "ec2/$DEPLOY_ENV/terraform.tfstate" \
            --region "$TF_STATE_REGION"

      - name: Terraform Plan
        env:
          DEPLOY_ENV: ${{ inputs.environment }}
          ACTION: ${{ inputs.action }}
        run: |
          if [ "$ACTION" = "destroy" ]; then
            terraform plan -destroy -input=false \
              -var-file="environments/$DEPLOY_ENV.tfvars" \
              -out=tfplan
          else
            terraform plan -input=false \
              -var-file="environments/$DEPLOY_ENV.tfvars" \
              -out=tfplan
          fi

      - name: Terraform Apply
        if: inputs.action == 'apply' || inputs.action == 'destroy'
        run: terraform apply -input=false tfplan

      - name: Cleanup
        if: always()
        run: rm -f tfplan
